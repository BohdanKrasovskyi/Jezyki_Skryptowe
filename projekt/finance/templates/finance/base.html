<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinanceApp{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f2f5; }
    .sidebar {
      min-height: 100vh;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      width: 250px;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      padding-top: 1rem;
    }
    .sidebar .nav-link {
      color: rgba(255,255,255,.75);
      border-radius: 8px;
      margin: 2px 10px;
      padding: 10px 14px;
      font-weight: 500;
      transition: all .2s;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      color: #fff;
      background: rgba(255,255,255,.15);
    }
    .sidebar .nav-link i { width: 22px; }
    .sidebar-brand {
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 1rem 1.5rem 1.5rem;
      display: block;
      text-decoration: none;
      letter-spacing: .5px;
    }
    .sidebar-brand span { color: #e94560; }
    .main-content { margin-left: 250px; padding: 2rem; }
    .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .card-header { border-radius: 16px 16px 0 0 !important; border-bottom: none; }
    .stat-card { border-radius: 16px; border: none; }
    .stat-card .icon-box {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .badge-income { background: #d1fae5; color: #065f46; }
    .badge-expense { background: #fee2e2; color: #991b1b; }
    .table thead th { border-top: none; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
    .amount-income { color: #059669; font-weight: 600; }
    .amount-expense { color: #dc2626; font-weight: 600; }
    .section-title { font-weight: 700; font-size: 1.5rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<div class="sidebar">
  <a href="{% url 'dashboard' %}" class="sidebar-brand"><i class="bi bi-bar-chart-fill me-2" style="color:#e94560"></i>Finance<span>App</span></a>
  <nav class="nav flex-column">
    <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{% url 'transaction_list' %}" class="nav-link {% if 'transaction' in request.resolver_match.url_name %}active{% endif %}">
      <i class="bi bi-list-ul"></i> Transakcje
    </a>
    <a href="{% url 'add_transaction' %}" class="nav-link">
      <i class="bi bi-plus-circle"></i> Dodaj transakcję
    </a>
    <hr style="border-color:rgba(255,255,255,.1); margin: .5rem 1rem">
    <a href="{% url 'categories' %}" class="nav-link {% if request.resolver_match.url_name == 'categories' %}active{% endif %}">
      <i class="bi bi-tags"></i> Kategorie
    </a>
    <a href="{% url 'accounts' %}" class="nav-link {% if request.resolver_match.url_name == 'accounts' %}active{% endif %}">
      <i class="bi bi-bank"></i> Konta
    </a>
    <hr style="border-color:rgba(255,255,255,.1); margin: .5rem 1rem">
    <a href="{% url 'reports' %}" class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
      <i class="bi bi-graph-up"></i> Raporty
    </a>
    <a href="{% url 'banking' %}" class="nav-link {% if request.resolver_match.url_name == 'banking' %}active{% endif %}">
      <i class="bi bi-cloud-upload"></i> Import bankowy
    </a>
    <hr style="border-color:rgba(255,255,255,.1); margin: .5rem 1rem">
    <a href="/admin/" class="nav-link" target="_blank">
      <i class="bi bi-gear"></i> Admin
    </a>
  </nav>
</div>

<div class="main-content">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
